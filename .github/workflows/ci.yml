# ------------------------------------------------------------
# What every pull request has to get past before it can merge.
#
# Each check guards something that has gone wrong in this repo for real:
# a schema file that drifted 130 columns from the database, a seed that
# wrote to a column dropped long ago, a letter that could be sent twice,
# a query that read "the first profile", and routes that let one user
# read, change and send another user's rows. None of those were visible
# in the UI. All of them are visible here.
#
# Four jobs that run AT THE SAME TIME, each with its own empty database
# — so the wall-clock time is the slowest job, not the sum. They share
# nothing but the checkout:
#
#   schema     the migrations build what db/schema.sql says, from empty,
#              and every table is closed to Supabase's Data API
#   proofs     the rules that protect money and reputation, against a DB
#   build-e2e  the app compiles; then two real users against a real
#              server with login on cannot reach each other's rows
#   supabase   the hosted setup in miniature: a local Supabase stack, the
#              migrations on its Postgres, the Data API shut, and Google
#              mode's sign-in end to end (an email link stands in for
#              Google — same code exchange, cookies and callback)
#
# No secrets, no model calls: the proofs that need a model (the
# injection test) cost money per run and are started by hand.
# ------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://jobbflo:jobbflo@localhost:5432/jobbflo

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: jobbflo, POSTGRES_PASSWORD: jobbflo, POSTGRES_DB: jobbflo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobbflo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      # The workflow files themselves. GitHub rejects an invalid one
      # silently — deploy.yml once used "inputs.miljö", and the ö made the
      # whole file invalid, so the deploy would never have run.
      - name: Workflow files are valid
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -no-color

      # A migration merged without `npm run db:schema` fails here.
      - name: Schema snapshot matches the migrations
        run: time npm run db:check

      # A fresh install, the way a new user or a new environment gets one.
      - name: Install from empty
        run: time (npm run db:init && npm run db:seed)

      - name: Migrations are idempotent
        run: time npm run db:migrate

      # A migration that adds a table without row level security fails
      # here, before it can reach Supabase's Data API.
      - name: Proof — every table is closed to the Data API
        run: time node scripts/prove-rls.js

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: jobbflo, POSTGRES_PASSWORD: jobbflo, POSTGRES_DB: jobbflo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobbflo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run db:init && npm run db:seed

      - name: Proof — the grade is arithmetic over readable rows
        run: time node scripts/prove-checklist.js

      - name: Proof — a letter can never be sent twice
        run: time node scripts/prove-send-transaction.js

      - name: Proof — no code picks a profile by guessing
        run: time node scripts/prove-profile-scope.js

      - name: Proof — one user's mail stays that user's
        run: time node scripts/prove-imap-scope.js

      - name: Proof — each user reads ads for themselves, thin reads are not graded
        run: time node scripts/prove-ad-reads.js

      # Two throwaway databases on the same server: a "local" one and a
      # "cloud" one with another user in it.
      - name: Proof — local history moves into one cloud account, whole
        run: time node scripts/prove-history-move.js

      # A deploy starts the new container before stopping the old one; the
      # worker used to exit on the old one's lock and leave none running.
      - name: Proof — a deploy leaves exactly one worker, never none
        run: time node scripts/prove-single-instance.js

      # A fake OpenAI-compatible server stands in for OpenRouter.
      - name: Proof — every AI call is measured by task, at the price charged
        run: time node scripts/prove-ai-matning.js

      # A fake Vercel and Railway; the release must answer with its commit.
      - name: Proof — a deploy is green only when the release runs
        run: time node scripts/prove-deploy-verify.js

      # raw keeps only what is read; a new raw-> path in the code that the
      # slimming drops fails here instead of matching nothing in production.
      - name: Proof — the ad pool keeps every field the app reads, once
        run: time node scripts/prove-ad-raw.js

      # Which AI a user can choose, and where the server will call it:
      # localhost and private networks are refused before a request leaves.
      - name: Proof — three providers, the operator's models, no internal addresses
        run: time node scripts/prove-llm-val.js

      # One beacon round must ask for every view on screen and hand each
      # its own answer — two searches must not overwrite each other.
      - name: Proof — the shared beacon asks for every view, and answers each its own
        run: time node scripts/prove-beacon.js

  build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: jobbflo, POSTGRES_PASSWORD: jobbflo, POSTGRES_DB: jobbflo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobbflo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      # Next keeps its compile cache in .next/cache; reusing it between
      # runs turns a full build into an incremental one.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'src/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: time npm run build

      - run: npm run db:init && npm run db:seed

      # Two real users, a real server with login on: every route that is
      # handed the other user's id must answer 404 and change nothing,
      # and no list may show the other user's rows. Run against the code
      # before these checks existed, 28 of 32 calls got through.
      - name: Proof — one user cannot reach another's rows
        env:
          AUTH_SECRET: ci-only-not-a-real-secret
        run: |
          npx next start -p 3100 > next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3100/api/profile && break
            sleep 1
          done
          time PROVE_BASE_URL=http://localhost:3100 node scripts/prove-owner-checks.js \
            || { cat next.log; exit 1; }
          # The admin pages: 404 for everyone else, and a block that
          # actually stops the account, its campaigns and its mailbox.
          time PROVE_BASE_URL=http://localhost:3100 node scripts/prove-admin.js \
            || { cat next.log; exit 1; }
          # A new account is guided in once; the cost estimate is
          # arithmetic over measured tokens and listed prices.
          time PROVE_BASE_URL=http://localhost:3100 node scripts/prove-onboarding.js \
            || { cat next.log; exit 1; }
          # GDPR: the export holds everything and nothing of anyone else;
          # erasure leaves no row pointing at the user in any table.
          time PROVE_BASE_URL=http://localhost:3100 node scripts/prove-account.js \
            || { cat next.log; exit 1; }
          # The routes someone could hammer stop at their limit.
          time PROVE_BASE_URL=http://localhost:3100 node scripts/prove-rate-limits.js \
            || { cat next.log; exit 1; }

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The local stack's own Postgres (ports from supabase/config.toml):
      # the app's tables live in the same database as in production.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Start Supabase
        run: time npx supabase start -x studio,storage-api,realtime,edge-runtime,logflare,vector,imgproxy,postgres-meta

      # The stack's URL and keys are the CLI's public demo values, read
      # from the stack itself rather than written down here.
      - name: Read the stack's settings
        run: |
          npx supabase status -o json > sb.json
          {
            echo "SUPABASE_URL=$(node -p "require('./sb.json').API_URL")"
            echo "SUPABASE_ANON_KEY=$(node -p "require('./sb.json').ANON_KEY")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(node -p "require('./sb.json').SERVICE_ROLE_KEY")"
          } >> "$GITHUB_ENV"

      - name: Migrations on Supabase's Postgres
        run: time (npm run db:init && npm run db:seed)

      # What the deploy workflow checks on the real databases. Supabase
      # adds its own extensions to every project; this is where a check
      # that counts them as hand edits fails, before a deploy does.
      - name: The live check accepts a Supabase database
        run: time npm run db:check -- --live

      # With a seeded profile in place, so an open table would have a row
      # to leak rather than answering an innocent empty list.
      - name: Proof — the Data API returns nothing with the public key
        run: time node scripts/prove-rls.js

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'src/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: time npm run build

      - name: Proof — Google-mode sign-in, end to end
        env:
          SUPABASE_EPOSTLANK: '1'
        run: |
          npx next start -p 3100 > next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3100/login && break
            sleep 1
          done
          time PROVE_BASE_URL=http://localhost:3100 node scripts/prove-supabase-login.js             || { cat next.log; exit 1; }
