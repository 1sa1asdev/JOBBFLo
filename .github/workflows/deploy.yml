# ------------------------------------------------------------
# From a green main to staging, and from a release to production.
#
# The rule this exists for: code never runs against a schema older than
# it. Vercel (the app) and Railway (worker, janitor) do not deploy from
# main — they deploy from the branches `staging` and `production`, and
# only this workflow moves those, AFTER it has migrated and checked the
# database they will talk to.
#
#   main is green (CI passed)  →  migrate the STAGING database
#                              →  check it matches the migrations, and
#                                 that the Data API is shut
#                              →  move `staging` → Vercel + Railway
#                                 deploy staging
#
#   a release is published     →  the same against PRODUCTION, after a
#                                 person approves it (the `production`
#                                 environment's required reviewers),
#                                 and only for a commit staging has run
#
# Migrations therefore run while the previous code is still serving:
# every migration must work with the code before it (add, backfill,
# switch over, and drop in a LATER release — never rename in place).
#
# Off until the environments exist: the repository variable
# DEPLOY_ENABLED = true (Settings → Secrets and variables → Actions →
# Variables) turns it on. Without it a merge would start a deploy with
# no database to migrate.
#
# Secrets live in GitHub → Settings → Environments, per environment:
#   DATABASE_URL       Supabase session pooler (port 5432)
#   SUPABASE_URL       for the Data API check
#   SUPABASE_ANON_KEY  ditto — the public key, used to prove it reads nothing
#   DATABASE_CA_CERT   Supabase's CA certificate (PEM text), so the connection
#                      is encrypted and the server verified
#
# And for checking that the release runs (all optional, DEPLOY.md §8):
#   vars    APP_URL               the environment's address; /api/health
#           VERIFY_WORKER=true    also wait for the worker and janitor
#           RAILWAY_WORKER_SERVICE / RAILWAY_JANITOR_SERVICE
#                                 their names on Railway, if not "worker"/"janitor"
#   secrets VERCEL_DEPLOY_HOOK    Vercel's deploy hook for the branch
#           RAILWAY_TOKEN         a Railway project token for the environment
#           VERCEL_BYPASS         if the deployment is behind Vercel's login
# ------------------------------------------------------------
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # ASCII only: a non-ASCII input name ("miljö") made GitHub reject
      # this whole file, so it never ran.
      miljo:
        description: 'staging eller production'
        required: true
        default: staging

permissions:
  contents: write

jobs:
  staging:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
        || (github.event_name == 'workflow_dispatch' && inputs.miljo == 'staging'))
    runs-on: ubuntu-latest
    # migrations and checks take minutes; waiting for the release to
    # come up takes up to 15 more (scripts/verify-deploy.js)
    timeout-minutes: 30
    environment: staging
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Supabase's CA: without it these migrations went over the internet
      # unencrypted, database password and all.
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SHA }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Migrate the staging database
        run: node scripts/migrate.js

      - name: The database matches the migrations
        run: npm run db:check -- --live

      # Idempotent; matters after a restore, which brings tables back with
      # the project's default grants (scripts/lock-data-api.js).
      - name: Lock the Data API
        run: node scripts/lock-data-api.js

      - name: The Data API reads nothing
        run: node scripts/prove-rls.js

      - name: Deploy — move the staging branch
        run: git push --force origin "$SHA:refs/heads/staging"

      # Moving the branch only asks Vercel and Railway to build. On 21 Oct
      # Railway was down when it moved, this run went green, and the
      # worker ran the old code for hours. This waits until the app, the
      # worker and the janitor answer with this commit, nudges a host that
      # missed the push, and fails if one never does.
      - name: The release is running
        if: vars.APP_URL != '' || vars.VERIFY_WORKER == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERIFY_WORKER: ${{ vars.VERIFY_WORKER }}
          RAILWAY_WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE }}
          RAILWAY_JANITOR_SERVICE: ${{ vars.RAILWAY_JANITOR_SERVICE }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/verify-deploy.js "$SHA"

  production:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        github.event_name == 'release'
        || (github.event_name == 'workflow_dispatch' && inputs.miljo == 'production'))
    runs-on: ubuntu-latest
    # migrations and checks take minutes; waiting for the release to
    # come up takes up to 15 more (scripts/verify-deploy.js)
    timeout-minutes: 30
    # Required reviewers on this environment make a person approve
    # before anything below runs.
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Supabase's CA: without it these migrations went over the internet
      # unencrypted, database password and all.
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      # Production only gets what staging has already run.
      - name: This commit has been on staging
        run: |
          git fetch origin staging
          git merge-base --is-ancestor HEAD origin/staging \
            || { echo "::error::$(git rev-parse --short HEAD) har inte körts i staging — släpp en commit som finns där"; exit 1; }

      - name: Migrate the production database
        run: node scripts/migrate.js

      - name: The database matches the migrations
        run: npm run db:check -- --live

      # Idempotent; matters after a restore, which brings tables back with
      # the project's default grants (scripts/lock-data-api.js).
      - name: Lock the Data API
        run: node scripts/lock-data-api.js

      - name: The Data API reads nothing
        run: node scripts/prove-rls.js

      - name: Deploy — move the production branch
        run: git push --force origin "HEAD:refs/heads/production"

      # Moving the branch only asks Vercel and Railway to build. On 21 Oct
      # Railway was down when it moved, this run went green, and the
      # worker ran the old code for hours. This waits until the app, the
      # worker and the janitor answer with this commit, nudges a host that
      # missed the push, and fails if one never does.
      - name: The release is running
        if: vars.APP_URL != '' || vars.VERIFY_WORKER == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERIFY_WORKER: ${{ vars.VERIFY_WORKER }}
          RAILWAY_WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE }}
          RAILWAY_JANITOR_SERVICE: ${{ vars.RAILWAY_JANITOR_SERVICE }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/verify-deploy.js "$(git rev-parse HEAD)"
